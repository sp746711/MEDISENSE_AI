# MediSense AI — Docker Compose
# Optional. Local development can run frontend/backend without Docker.
# Requires Docker Desktop (or compatible engine).

services:
  postgres:
    image: postgres:16-alpine
    container_name: medisense-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: medisense
      POSTGRES_PASSWORD: medisense_dev_password
      POSTGRES_DB: medisense_ai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medisense -d medisense_ai"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: medisense-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg2://medisense:medisense_dev_password@postgres:5432/medisense_ai
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000
    ports:
      - "8000:8000"
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/models:/app/models
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: medisense-frontend
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data:
